<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tunisia · 18–25 Sep</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#plan" data-view-link="plan"><b>Tunisia</b><span id="brandDates"></span></a>
    <nav class="seg views" role="tablist" id="viewTabs" aria-label="Views"></nav>
    <button class="lang" id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <section id="plan" class="view" role="tabpanel" aria-labelledby="tab-plan">
    <div class="wrap">
      <div class="dayStrip" id="dayStrip" role="tablist" aria-label="Days"></div>
      <div class="planGrid">
        <div class="mapCol"><div id="map" class="map" aria-label="Map"></div><div class="mapTools" id="mapTools" hidden></div></div>
        <div class="dayCol" id="dayPanel"></div>
      </div>
    </div>
  </section>

  <section id="explore" class="view" role="tabpanel" aria-labelledby="tab-explore" hidden>
    <div class="wrap">
      <div class="adding" id="addingBanner" hidden></div>
      <div class="seg cats" role="tablist" id="catTabs" aria-label="Categories"></div>
      <div class="filters">
        <div class="chips" id="areaChips"></div>
        <label class="search"><span class="icon" id="searchIcon"></span><input type="search" id="search" autocomplete="off"></label>
      </div>
      <div class="grid" id="placeGrid"></div>
    </div>
  </section>

  <section id="book" class="view" role="tabpanel" aria-labelledby="tab-book" hidden>
    <div class="wrap narrow" id="bookPanel"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Views"></nav>
<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
